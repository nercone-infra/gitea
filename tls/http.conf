http {
    include /etc/nginx/snippets/ruconet-http.conf;

    # Gitea
    server {
        listen gitea.ruconet.internal:443 ssl;

        include /etc/nginx/snippets/ruconet.conf;
        include /etc/nginx/snippets/ruconet-gateway.conf;

        client_max_body_size 100m;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/snippets/ruconet-forward.conf;
        }
    }
}
